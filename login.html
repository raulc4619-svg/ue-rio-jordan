<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U.E. Rio Jordan – Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ---- Fondo: foto de la escuela ---- */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    /* Foto de fondo */
    .bg-scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('img/555564286_24559917220338537_7291867738354728102_n.jpg') center/cover no-repeat;
    }

    /* Overlay oscuro encima de la foto */
    .bg-scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10,16,28,.88) 0%,
        rgba(15,23,42,.78) 55%,
        rgba(10,16,28,.70) 100%
      );
    }

    /* ---- MARCA DE AGUA: logo grande centrado ---- */
    .logo-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, 85vw);
      height: min(520px, 85vw);
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: screen;        /* elimina el fondo blanco visualmente */
      opacity: .07;
      filter: grayscale(1) brightness(8);
    }

    /* Anillo decorativo alrededor de la marca de agua */
    .watermark-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, 90vw);
      height: min(560px, 90vw);
      border-radius: 50%;
      border: 1px solid rgba(245,158,11,.06);
      z-index: 1;
      pointer-events: none;
    }
    .watermark-ring::before {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px solid rgba(245,158,11,.04);
    }

    /* ---- Card de login ---- */
    .login-card {
      position: relative;
      z-index: 10;
      width: min(420px, 94vw);
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 40px 36px 36px;
      box-shadow:
        0 0 0 1px rgba(245,158,11,.08),
        0 32px 80px rgba(0,0,0,.5),
        0 8px 24px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.08);
      animation: cardIn .6s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardIn {
      from { opacity:0; transform: translateY(28px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* ---- Logo dentro del card ---- */
    .card-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: rgba(245,158,11,.1);
      border: 1px solid rgba(245,158,11,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 0 30px rgba(245,158,11,.12), 0 4px 16px rgba(0,0,0,.3);
      overflow: hidden;
      position: relative;
    }

    .logo-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(245,158,11,.15), transparent);
    }

    .logo-badge img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      mix-blend-mode: multiply;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.3));
    }

    .card-school-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(245,158,11,.7);
      margin-bottom: 4px;
    }

    .card-school-name {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.01em;
    }

    .card-school-sub {
      font-size: 12px;
      color: rgba(255,255,255,.38);
      margin-top: 2px;
    }

    /* ---- Divider ---- */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      margin: 24px 0;
    }

    /* ---- Form ---- */
    .form-label-white {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.55);
      margin-bottom: 6px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .input-dark {
      width: 100%;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 13px 16px 13px 44px;
      font-size: 15px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }

    .input-dark::placeholder { color: rgba(255,255,255,.22); }

    .input-dark:focus {
      border-color: rgba(245,158,11,.5);
      background: rgba(255,255,255,.09);
      box-shadow: 0 0 0 3px rgba(245,158,11,.12);
    }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: .5;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      opacity: .45;
      transition: opacity .2s;
      color: #fff;
      padding: 4px;
    }
    .toggle-pw:hover { opacity: .85; }

    /* ---- Error ---- */
    .login-error {
      display: none;
      background: rgba(220,38,38,.15);
      border: 1px solid rgba(220,38,38,.3);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* ---- Botón principal ---- */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #0d1420;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
      box-shadow: 0 4px 16px rgba(245,158,11,.35), 0 1px 3px rgba(0,0,0,.2);
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(245,158,11,.45);
      filter: brightness(1.05);
    }

    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    /* ---- Footer ---- */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11.5px;
      color: rgba(255,255,255,.22);
      line-height: 1.6;
    }

    .login-footer strong { color: rgba(255,255,255,.4); }

    /* ---- Responsive ---- */
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px 24px; border-radius: 20px; }
      .logo-badge { width: 76px; height: 76px; }
      .logo-badge img { width: 62px; height: 62px; }
      .card-school-name { font-size: 17px; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(13,20,32,.3);
      border-top-color: #0d1420;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
  </style>
</head>
<body>

  <!-- Fondo -->
  <div class="bg-scene"></div>

  <!-- Marca de agua logo grande -->
  <img src="logo.png" class="logo-watermark" alt="">
  <div class="watermark-ring"></div>

  <!-- Card principal -->
  <div class="login-card">

    <!-- Logo + nombre -->
    <div class="card-logo">
      <div class="logo-badge">
        <img src="logo.png" alt="Logo U.E. Rio Jordan">
      </div>
      <div class="card-school-tag">Unidad Educativa</div>
      <div class="card-school-name">Rio Jordan</div>
      <div class="card-school-sub">Sistema de Gestión Escolar</div>
    </div>

    <div class="divider"></div>

    <!-- Error -->
    <div class="login-error" id="login-error">⚠ Usuario o contraseña incorrectos.</div>

    <!-- Usuario -->
    <label class="form-label-white">Usuario</label>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input type="text" id="username" class="input-dark"
        placeholder="Ingresa tu usuario" autocomplete="username">
    </div>

    <!-- Contraseña -->
    <label class="form-label-white">Contraseña</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="password" class="input-dark"
        placeholder="Ingresa tu contraseña" autocomplete="current-password" style="padding-right:44px">
      <button class="toggle-pw" onclick="togglePw()" type="button" id="btn-eye">👁</button>
    </div>

    <!-- Botón -->
    <button class="btn-login" onclick="doLogin()" id="btn-login">
      Ingresar al sistema →
    </button>

    <!-- Footer -->
    <div class="login-footer">
      ¿Problemas de acceso? Contacta al área administrativa.<br>
      <strong>U.E. Rio Jordan</strong> · Sistema Escolar 2026
    </div>

  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  initDB();
  if (getSession()) window.location.href = 'dashboard.html';

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  function togglePw() {
    const pw = document.getElementById('password');
    const eye = document.getElementById('btn-eye');
    if (pw.type === 'password') { pw.type = 'text'; eye.textContent = '🙈'; }
    else { pw.type = 'password'; eye.textContent = '👁'; }
  }

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('btn-login');

    errEl.style.display = 'none';

    if (!username || !password) {
      errEl.style.display = 'block';
      errEl.textContent = '⚠ Completa todos los campos.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Verificando...';

    setTimeout(() => {
      const result = login(username, password);
      if (result.ok) {
        btn.innerHTML = '✓ Acceso concedido';
        btn.style.background = 'linear-gradient(135deg,#16a34a,#15803d)';
        btn.style.color = '#fff';
        btn.style.boxShadow = '0 4px 16px rgba(22,163,74,.4)';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      } else {
        errEl.style.display = 'block';
        errEl.textContent = '⚠ Usuario o contraseña incorrectos.';
        btn.disabled = false;
        btn.innerHTML = 'Ingresar al sistema →';
      }
    }, 700);
  }
</script>
</body>
</html>
